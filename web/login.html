<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ورود — GameNet Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<nav class="nav"><div class="nav-inner">
  <a class="brand" href="/">🎮 <span>GameNet Platform</span></a>
  <div class="spacer"></div><a href="/register">ثبت‌نام</a>
</div></nav>
<div class="container narrow" style="padding-top:48px">
  <div class="card">
    <h2>ورود</h2>
    <p class="muted">به حساب خود وارد شوید</p>
    <div id="alert"></div>
    <label>ایمیل</label>
    <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
    <label>رمز عبور</label>
    <input id="password" type="password" autocomplete="current-password">
    <div style="display:flex;gap:8px;margin-top:18px">
      <button id="btn" class="btn btn-primary" style="flex:1">ورود</button>
    </div>
    <p class="muted" style="margin-top:14px"><a href="/forgot">فراموشی رمز</a> · <a href="/register">ساخت حساب</a></p>
    <hr style="border:none;border-top:1px solid var(--line);margin:16px 0">
    <div id="gsi" style="width:100%;display:flex;justify-content:center;margin-top:4px;min-height:40px"></div>
  </div>
</div>
<script src="/assets/js/config.js"></script>
  <script src="/assets/js/core.js"></script>
<script>
const alertBox = document.getElementById('alert');
function show(msg, cls='alert-error'){ alertBox.innerHTML = `<div class="alert ${cls}">${esc(msg)}</div>`; }
document.getElementById('btn').onclick = async ()=>{
  alertBox.innerHTML='';
  const btn=document.getElementById('btn'); btn.disabled=true; btn.classList.add('loading');
  try{
    const r = await API.post('/api/auth/login', {
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value,
    });
    toast('خوش آمدید');
    const next = qs('next');
    location.href = next || (r.user.roles.includes('super_admin')||r.user.roles.includes('admin') ? '/admin/' : '/app/');
  }catch(e){ show(e.message); btn.disabled=false; btn.classList.remove('loading'); }
};
API.get('/api/auth/me').then(u=>{ if(u) location.href='/app/'; }).catch(()=>{});
/* Google Sign-In (GIS) — rendered only when GOOGLE_CLIENT_ID is configured in config.js */
(function(){
  const CID = (window.GN_CONFIG && GN_CONFIG.GOOGLE_CLIENT_ID) || '';
  const box = document.getElementById('gsi');
  if(!CID || !box){ if(box) box.innerHTML = '<span class="muted" style="font-size:12px">ورود با گوگل به‌زودی فعال می‌شود</span>'; return; }
  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.defer = true;
  s.onload = function(){
    try{
      google.accounts.id.initialize({
        client_id: CID,
        callback: async (res)=>{
          alertBox.innerHTML = '';
          try{
            const r = await API.post('/api/auth/google', { credential: res.credential });
            toast('خوش آمدید');
            const next = qs('next');
            location.href = next || (r.user.roles.includes('super_admin')||r.user.roles.includes('admin') ? '/admin/' : '/app/');
          }catch(e){ show(e.message); }
        }
      });
      google.accounts.id.renderButton(box, { theme:'outline', size:'large', text:'continue_with', locale:'fa', shape:'rectangular', width: Math.max(200, Math.min(280, box.clientWidth || 280)) });
    }catch(e){ box.innerHTML = '<span class="muted" style="font-size:12px">خطا در بارگذاری ورود گوگل — صفحه را تازه‌سازی کنید</span>'; }
  };
  s.onerror = function(){ box.innerHTML = '<span class="muted" style="font-size:12px">عدم دسترسی به سرویس گوگل — از رمز عبور استفاده کنید</span>'; };
  document.head.appendChild(s);
})();
</script>
</body></html>
