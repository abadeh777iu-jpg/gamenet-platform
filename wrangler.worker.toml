# Plain-Worker deployment config (gamenet-server) — API + static assets,
# sharing the SAME KV database as the Pages project. Secrets are set with
# `wrangler secret put` (never in this file).
name = "gamenet-server"
main = "worker/main.mjs"
compatibility_date = "2024-09-24"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./web"
binding = "ASSETS"
run_worker_first = true

[vars]
APP_URL = "https://abadeh777iu-jpg.github.io"
NODE_ENV = "production"

[[kv_namespaces]]
binding = "DB"
id = "354d01aceaab41b48d16c87e03407a43"
